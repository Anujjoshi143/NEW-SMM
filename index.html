function normalize(x){let d=defaults();if(!x||!x.users)return d;x.settings=x.settings||d.settings;x.settings.payment=x.settings.payment||d.settings.payment;x.settings.support=x.settings.support||d.settings.support;x.next=x.next||d.next;x.services=Array.isArray(x.services)&&x.services.some(s=>s.id>=25)?x.services.filter(s=>s.active!==false):d.services;x.users.forEach(u=>{if(u.pass&&!u.passHash){u.passHash=hashPass(u.pass);delete u.pass}});let adm=x.users.find(u=>u.uid===ADMIN_ID);if(adm){if(!adm.passHash)adm.passHash=ADMIN_HASH;adm.role='admin';adm.status='active'}else{x.users.unshift(d.users[0])}return x}
function load(){try{let x=JSON.parse(localStorage.getItem(STORE));return normalize(x)}catch(e){return defaults()}}
function cloudCopy(){let x=JSON.parse(JSON.stringify(state));x.currentUser=null;return x}
function saveLocal(){localStorage.setItem(STORE,JSON.stringify(state))}
/* Firebase is the primary database; localStorage is only an offline cache. */
function save(){
  saveLocal();
  if(firebaseReady&&firebaseStateDoc)firebaseStateDoc.set(cloudCopy()).catch(e=>console.error('Firebase save failed:',e));
  renderNav()
}
async function loadFirebase(){
  if(!firebaseStateDoc)return;
  try{
    const snap=await firebaseStateDoc.get();
    if(snap.exists){state=normalize(snap.data());saveLocal()}
    else await firebaseStateDoc.set(cloudCopy());
    firebaseReady=true;
    renderNav();
    routePage();
  }catch(e){
    console.error('Firebase database unavailable:',e);
    /* The existing offline cache keeps the panel usable if Firebase is unavailable. */
  }
}
